<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kofoworola ❤️</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            overflow: hidden;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 25px;
            max-width: 360px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        h1 { font-size: 32px; margin-bottom: 10px; }
        h2 { font-size: 20px; font-weight: normal; margin-bottom: 30px; }

        .buttons { position: relative; height: 140px; }

        .btn {
            background: #fff;
            color: #ff5e78;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
        }

        #noBtn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 70px;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Kofoworola 💖</h1>
    <h2>Will you be my Valentine?</h2>

    <div class="buttons">
        <button class="btn" onclick="yes()">YES 💕</button>
        <button class="btn" id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">No 😒</button>
    </div>
</div>

<script>
function yes() {
    document.body.innerHTML = `
        <div style="min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;">
            <div>
                <h1>Yayyy 🥰</h1>
                <p style="font-size:22px;">I knew it had to be you, Kofoworola ❤️</p>
                <p>This Valentine feels right with you 💐</p>
                <p style="margin-top:20px;opacity:0.9;">— from the guy that loves you 🤍</p>
            </div>
        </div>
    `;
}

function runAway() {
    const btn = document.getElementById("noBtn");
    const card = document.querySelector(".card");
    btn.style.left = Math.random() * (card.offsetWidth - btn.offsetWidth) + "px";
    btn.style.top = Math.random() * (card.offsetHeight - btn.offsetHeight) + "px";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
